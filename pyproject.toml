[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxotron"
version = "0.2.0"
description = "Minimal, hackable 4D-parallel (DP/FSDP, TP, PP, CP) LLM pre-training in JAX"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Jaxotron contributors" }]
keywords = ["jax", "llm", "distributed-training", "tensor-parallelism", "pipeline-parallelism",
            "context-parallelism", "fsdp", "tpu", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "jax>=0.4.35",
  "equinox>=0.11.4",
  "optax>=0.2.3",
  "orbax-checkpoint>=0.6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.35"]
tpu = ["jax[tpu]>=0.4.35"]
data = ["datasets>=2.19", "transformers>=4.40"]
wandb = ["wandb"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/rishiraj/jaxotron"

[tool.setuptools.packages.find]
include = ["jaxotron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
